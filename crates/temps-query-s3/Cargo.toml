[package]
name = "temps-query-s3"
version = "0.1.0"
edition = "2021"

[dependencies]
temps-query = { path = "../temps-query" }

# AWS SDK for S3
aws-config = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-credential-types = "1.2"

# Serialization
serde_json = "1.0"

# Logging
tracing = "0.1"

# Async trait
async-trait = "0.1"

# Streaming
futures = "0.3"
bytes = "1.11.1"
tokio-util = { version = "0.7", features = ["io"] }
